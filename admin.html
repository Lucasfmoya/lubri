<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Cross-Origin-Opener-Policy"
      content="same-origin-allow-popups"
    />
    <title>Panel Admin | Lubricentro O'Higgins</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="adm-body">
    <div class="adm-wrapper">
      <div class="adm-card">
        <!-- HEADER LOGO -->
        <div class="adm-header">
          <div>
            <img
              src="./img/logo-ovalado.png"
              alt="Logo Lubricentro"
              class="img-fluid"
            />
          </div>
        </div>

        <hr class="adm-divider" />

        <!-- LOGIN -->
        <div id="btnLogin">
          <p class="adm-title">Acceso restringido</p>
          <p class="adm-subtitle">Solo para administradores autorizados</p>

          <button id="btnLoginBtn" class="adm-btn-google">
            <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
              />
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
              />
              <path
                fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
              />
            </svg>
            Iniciar sesión con Google
          </button>
        </div>

        <!-- PANEL ADMIN -->
        <div id="adminPanel" style="display: none">
          <div class="adm-panel-header">
            <p class="adm-welcome">
              Bienvenido,
              <span id="userEmailSpan" class="adm-welcome-email"></span>
            </p>
            <button id="btnLogout" class="adm-btn-logout">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Cerrar sesión
            </button>
          </div>

          <div class="drop-zone" id="dropZone">
            <svg
              class="adm-drop-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="12" y1="18" x2="12" y2="12" />
              <line x1="9" y1="15" x2="15" y2="15" />
            </svg>
            <p class="adm-drop-text">Arrastrá tu Excel acá</p>
            <small class="adm-drop-small">o hacé click para seleccionar</small>
            <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
          </div>

          <div id="fileInfo" class="adm-file-info"></div>
          <button
            id="btnEliminar"
            class="adm-btn-eliminar"
            style="display: none"
          >
            ✕ Quitar archivo
          </button>
          <button id="btnSubir" class="adm-btn-subir" disabled>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <polyline points="16 16 12 12 8 16" />
              <line x1="12" y1="12" x2="12" y2="21" />
              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
            </svg>
            Subir archivo
          </button>

          <div id="log" class="adm-log"></div>
        </div>
      </div>
      <div
        class="adm-footer d-flex align-items-center justify-content-between p-4"
      >
        <p class="adm-footer-note mb-0">
          Lubricentro O'Higgins &mdash; Área interna
        </p>

        <a
          href="./index.html"
          class="btn btn-outline-light btn-sm adm-footer-btn"
        >
          Página principal
        </a>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
