<!doctype html>
<html lang="es">
  <link>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel Admin | Importar Servicios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/lubri/css/style.css">
  </head>
  <body class="bg-adm">
    <div class="container py-5">
      <div class="text-center mb-5">
        <h2>Panel Admin</h2>
        <p class="text-muted">Importar historial desde Excel</p>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card p-4 bg-dark text-white">
            <div class="drop-zone" id="dropZone">
              <p class="mb-2">Arrastrá tu archivo Excel acá</p>
              <small class="text-muted">o hacé click para seleccionar</small>
              <input type="file" id="fileInput" accept=".xlsx, .xls" hidden />
            </div>
            <div id="fileInfo" class="mt-3 small text-info"></div>
            <button class="btn btn-danger w-100 mt-3" id="btnSubir" disabled>
              Subir archivo
            </button>
            <div class="progress mt-3" style="height: 20px">
              <div
                id="progressBar"
                class="progress-bar progress-bar-striped progress-bar-animated"
                style="width: 0%"
              >
                0%
              </div>
            </div>

            <div class="log-box mt-3" id="log"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
